site_name: sitelabs-opencypher-graphtool
site_url: https://sitelabs-com.github.io/sitelabs-opencypher-graphtool/
repo_url: https://github.com/sitelabs-com/sitelabs-opencypher-graphtool
edit_uri: edit/main/docs/ # the theme's "Edit on GitHub" links (its default is master)
theme:
  name: readthedocs
  navigation_depth: 3 # How many levels of subheadings appear in the sidebar
  collapse_navigation: true # Collapse sections that aren't currently active
  titles_only: false # Show page subheadings (H2, H3) inside the sidebar
extra_css:
  - stylesheets/extra.css
hooks:
  - mkdocs_hooks.py # leaves each page's own menu block out of the site
plugins:
  - search
  - mike: # one site per release (0.2/, 0.3/ ...) and latest/: docs/development.md#the-documentation-site
      version_selector: true
      canonical_version: latest

# Written by `python tools/docs.py` from GROUPS in tools/docs.py (the docs' own menu): edit those, not this.
nav:
  - Overview:
      - Overview: overview.md
      - The modules: modules.md
  - Using it:
      - Extension points: extending.md
      - Query catalogue: query-catalogue.md
  - Development:
      - Development: development.md
  - References:
      - All documents: index.md
